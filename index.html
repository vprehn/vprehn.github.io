<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <label class="switch">
    <input type="checkbox" id="darkmode">
    <span class="slider"></span>
  </label>
  
  <div class="card">
    <div class="elements">
      <div class="ankunft_info">
        <h1>Ankunft bei Traumprinz</h1>
        <p id="ankunft"> Fr. 14.08. 14:04 Uhr</p>
      </div>
      <div class="timer">
        <p id="timer">00h 00m 00s</p>
      </div>
    </div>
  </div>
  <script src="timer.js"></script>
  
  <div class="game">
    <h2>🔫 Zerstöre die To Dos!</h2>
    <p class="game_desc">Klicke auf die herumfliegenden To Dos, um sie ein für alle mal ins Nirvana zu schicken!</p>
    
    <div id="todo_div">
      <p class="todo" id="todo_1">Aufräumen</p>
      <p class="todo" id="todo_2">Hausaufgaben machen</p>
      <p class="todo" id="todo_3">Arzttermine machen</p>
      <p class="todo" id="todo_4">Bei Freund:innen melden</p>
      <p class="todo" id="todo_5">Auf Test vorbereiten</p>
    </div>
  </div>
  
  <script src="destroyer.js"></script>
  <script src="darkmode.js"></script>
</body>
</html>
